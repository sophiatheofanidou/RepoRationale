[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reporationale"
version = "0.1.0"
description = "Evidence-grounded agentic RAG for recovering the rationale behind technical decisions from repository history."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.mypy]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
pretty = true
python_version = "3.13"
show_error_codes = true
strict = true
warn_unreachable = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
